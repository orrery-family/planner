/* ===== themes. Default "Орбита": French Blue, periwinkle, soft sky blue, a rare shy lilac; warm star-glow. ===== */
:root{
  --french:#3E4B8E; --wine:#720f32; --ocean:#114665; --rose:#7b445a; --night:#16202b; --gold:#F6E0B6; --gold-deep:#C9A66B; --powder:#A6BCC9;
  --paper:#EFEEF8; --card:#FAF9FE; --card-2:#E6E5F3; --line:rgba(35,42,92,.11);
  --ink:#1E2447; --ink-2:rgba(30,36,71,.76); --ink-3:rgba(30,36,71,.55);
  --accent:#3E4B8E; --danger:#8A2550; --sel:#E1E2F5;
  --on-bg:#262E66; --on-fg:#F8F7FE; --logo:#3E4B8E;
  --g-main:linear-gradient(120deg,#3E4B8E 0%,#5C68BE 58%,#8C86CE 100%);
  --bg:radial-gradient(55% 34% at 100% 14%,rgba(255,238,210,.85) 0%,rgba(255,238,210,0) 70%),radial-gradient(70% 45% at 0% 52%,rgba(146,168,228,.40) 0%,rgba(146,168,228,0) 70%),radial-gradient(85% 50% at 92% 96%,rgba(150,128,212,.55) 0%,rgba(150,128,212,.18) 50%,rgba(150,128,212,0) 78%),radial-gradient(75% 45% at 8% 100%,rgba(176,150,222,.50) 0%,rgba(176,150,222,0) 75%),linear-gradient(170deg,#F4F3FB 22%,#ECEAF8 48%,#E2DCF4 74%,#D6CCEF 100%);
  --sky:linear-gradient(180deg,#1A2056 0,#252E6C calc(100% - 300px),#4A4F9E calc(100% - 190px),#8C84CC calc(100% - 100px),#C4B9E8 calc(100% - 35px),#E6E1F5 100%);
  --sky-top:#1A2056;
  --pill:radial-gradient(80% 140% at 0% 0%,rgba(140,134,206,.8),rgba(140,134,206,0) 70%),radial-gradient(90% 160% at 100% 100%,#5C68BE,rgba(92,104,190,0) 70%),#1A2056;
  --sh:inset 0 1px 0 rgba(255,255,255,.9),0 1px 3px rgba(35,42,92,.06),0 10px 26px -20px rgba(35,42,92,.42);
  --sh-2:0 18px 40px -22px rgba(35,42,92,.55),0 2px 6px -2px rgba(35,42,92,.12);
  --scrim:rgba(20,24,60,.42);
  --glass:linear-gradient(180deg,rgba(255,255,255,.82) 0%,rgba(255,255,255,.5) 100%);
  --glass-on:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.82));
  --glass-brd:rgba(255,255,255,.85);
  --glass-sh:inset 0 1px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(35,42,92,.06),0 8px 20px -12px rgba(35,42,92,.38),0 1px 2px rgba(35,42,92,.06);
  --f:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --fd:'Unbounded','Manrope',system-ui,sans-serif;
  --mark:'Orrery Hero','Manrope',system-ui,sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}

  --ink:#1D2333; --ink-2:rgba(29,35,51,.76); --ink-3:rgba(29,35,51,.54);
  --accent:#3E4B8E; --danger:#720f32; --sel:#E6E2EC; --on-bg:#1D2333; --on-fg:#FFF4EB;
  --g-main:linear-gradient(120deg,#3E4B8E 0%,#720f32 100%);
  --bg:radial-gradient(70% 55% at 100% 100%,rgba(62,75,142,.30) 0%,rgba(62,75,142,.12) 45%,rgba(62,75,142,0) 75%),radial-gradient(60% 45% at 0% 55%,rgba(201,186,160,.32) 0%,rgba(201,186,160,0) 70%),linear-gradient(160deg,#F6EADB 35%,#EDE3D8 70%,#DEDCE3 100%);
  --sky:linear-gradient(180deg,#16202b 0,#1b2034 calc(100% - 300px),#3f3550 calc(100% - 180px),#7d6680 calc(100% - 90px),#bba2a6 calc(100% - 30px),#d8c3b8 100%);

  --sh:inset 0 1px 0 rgba(255,255,255,.8),0 1px 3px rgba(29,35,51,.06),0 10px 26px -20px rgba(29,35,51,.42);

}

  --sky:linear-gradient(180deg,#0A2130 0,#0E3247 calc(100% - 300px),#1F5470 calc(100% - 190px),#5D8DA5 calc(100% - 100px),#A8C5D0 calc(100% - 35px),#E2ECEC 100%);
  --sky-top:#0A2130;
  --pill:radial-gradient(80% 140% at 0% 0%,rgba(95,127,158,.8),rgba(95,127,158,0) 70%),radial-gradient(90% 160% at 100% 100%,#2B6A88,rgba(43,106,136,0) 70%),#0A2130;
  --sh:inset 0 1px 0 rgba(255,255,255,.9),0 1px 3px rgba(17,50,66,.06),0 10px 26px -20px rgba(17,50,66,.42);

}
html[data-theme="night"]{
  --paper:#11141D; --card:#1A1F2C; --card-2:#252B3C; --line:rgba(226,228,245,.09);
  --ink:#ECEBF5; --ink-2:rgba(236,235,245,.78); --ink-3:rgba(236,235,245,.56);
  --accent:#A9B2F4; --danger:#EC93B6; --sel:#2A3150; --on-bg:#E6E4F5; --on-fg:#151827; --logo:#A9B2F4;
  --g-main:linear-gradient(120deg,#3E4B8E 0%,#6A61B4 100%);
  --bg:radial-gradient(70% 55% at 100% 100%,rgba(62,75,142,.32) 0%,rgba(62,75,142,0) 72%),radial-gradient(60% 45% at 0% 50%,rgba(114,15,50,.16) 0%,rgba(114,15,50,0) 70%),linear-gradient(165deg,#12151E 30%,#141826 70%,#181A2B 100%);
  --sky:linear-gradient(180deg,#0A0D16 0,#10142A calc(100% - 300px),#1B2142 calc(100% - 190px),#1E2440 calc(100% - 100px),#171B2B calc(100% - 35px),#12151E 100%);
  --sky-top:#0A0D16;
  --pill:radial-gradient(80% 140% at 0% 0%,rgba(106,97,180,.7),rgba(106,97,180,0) 70%),radial-gradient(90% 160% at 100% 100%,#3E4B8E,rgba(62,75,142,0) 70%),#0A0D16;
  --sh:inset 0 1px 0 rgba(255,255,255,.05),0 10px 26px -18px rgba(0,0,0,.75);
  --sh-2:0 18px 40px -20px rgba(0,0,0,.8),0 2px 6px -2px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.58);
  --glass:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
  --glass-on:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.1));

}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:60;background:var(--sky-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);
  background-color:var(--paper);color:var(--ink);
  font:15px/1.4 var(--f);
  margin:0;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

.app{height:100%;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-block:0 104px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>:not(.hdr){max-width:528px;margin-left:auto;margin-right:auto;position:relative}

/* header: living night sky (wine -> french blue -> sand violet) melting into cream */
.hdr{position:relative;color:#FFF4EB;isolation:isolate;
  margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));
  padding:10px var(--gr) 150px var(--gl)}
.hdr.tall{padding-bottom:200px}
.hin{position:relative;z-index:1;max-width:528px;margin:0 auto}
.sky{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--sky);
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 170px),rgba(0,0,0,.9) calc(100% - 145px),rgba(0,0,0,.74) calc(100% - 118px),rgba(0,0,0,.54) calc(100% - 92px),rgba(0,0,0,.34) calc(100% - 66px),rgba(0,0,0,.17) calc(100% - 42px),rgba(0,0,0,.06) calc(100% - 20px),transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 170px),rgba(0,0,0,.9) calc(100% - 145px),rgba(0,0,0,.74) calc(100% - 118px),rgba(0,0,0,.54) calc(100% - 92px),rgba(0,0,0,.34) calc(100% - 66px),rgba(0,0,0,.17) calc(100% - 42px),rgba(0,0,0,.06) calc(100% - 20px),transparent 100%)}
.sky i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle closest-side,var(--k) 0%,var(--k2) 45%,transparent 100%);transform:translate(-50%,-50%);animation:drift var(--d) ease-in-out infinite alternate;will-change:transform}
@keyframes drift{0%{transform:translate(-50%,-50%) translate(0,0) scale(1)}50%{transform:translate(-50%,-50%) translate(var(--mx),var(--my)) scale(1.14)}100%{transform:translate(-50%,-50%) translate(calc(var(--mx) * -.8),calc(var(--my) * .5)) scale(.9)}}
.hdr>.hin>.deco{position:absolute;z-index:-1;top:38px;right:-10px;width:170px;height:96px;pointer-events:none}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.htitle{padding:22px 0 6px}
.eb{font-size:11.5px;color:rgba(255,244,235,.48);font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.htitle h1{font-size:clamp(46px,14.5vw,64px);line-height:.98;letter-spacing:-.035em;font-weight:500;margin:0;overflow-wrap:anywhere;hyphens:auto}
html.dys .htitle h1{letter-spacing:0;font-size:clamp(40px,12vw,54px)}
html.dys .eb{text-transform:none;letter-spacing:.04em}
h1{margin:2px 0 0;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:600}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink-2);flex:none;padding:0}
.ibtn.dk{background:rgba(255,244,235,.08);border-color:rgba(255,244,235,.16);color:#FFF4EB}
.hdr.today .set{position:absolute;top:0;right:0;z-index:2}
.ripple{display:block;width:100%;max-width:330px;height:auto;margin:6px auto 0}
.dt{text-align:center;margin-top:2px}
.dt h1{font-size:40px;letter-spacing:-.03em;line-height:1.05}
.dsub{margin-top:6px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(246,224,182,.8)}
.hdr.today .sum{justify-content:center;margin-top:10px}
.sum{display:flex;flex-wrap:wrap;gap:4px 16px;color:rgba(255,244,235,.7);font-size:14px;margin:6px 0 0}
.sum b{color:#FFF4EB;font-weight:600;font-variant-numeric:tabular-nums}
.daybar{display:flex;gap:2px;height:5px;border-radius:3px;overflow:hidden;margin-top:12px;background:rgba(255,244,235,.12)}
.daybar i{display:block;height:100%;background:var(--c)}
.psum{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-2);font-size:14px}
.psum b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.first,.sec.first{margin-top:-82px;position:relative}
.hdr.tall+.first{margin-top:-158px}
.hdr.today+.first{margin-top:-116px}
.sec{margin-top:22px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sh h2 span{color:var(--ink-3);font-weight:500;margin-left:6px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;min-height:40px;padding:0 4px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-3);margin:16px 0 8px}
.lbl.late{color:var(--danger)}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh)}
.list{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:0 6px 0 4px}
.muted{color:var(--ink-3)}
.empty{padding:22px 18px;text-align:center;color:var(--ink-2);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* buttons */
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--g-main);color:#FFF4EB;border-color:transparent}
.btn.primary:disabled{background:var(--card-2);color:var(--ink-3);cursor:default}
.btn.dark{background:var(--on-bg);color:var(--on-fg);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.wide{width:100%}
.seg{display:flex;gap:2px;padding:3px;border-radius:14px;background:var(--card-2)}
.seg button{flex:1;min-height:40px;border:0;border-radius:11px;background:transparent;color:var(--ink-2);font-weight:600;font-size:14px;padding:0 8px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;position:relative}
.chip.on{background:var(--on-bg);color:var(--on-fg);border-color:transparent}
.chip input[type=date],.chip input[type=time]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.field{width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px}
textarea.field{padding:12px 14px;min-height:76px;resize:vertical}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none}

/* live timer panel, sits inside the dark header */
.now{border-radius:22px;padding:16px;color:#FFF4EB;background:rgba(22,32,43,.28);border:1px solid rgba(255,244,235,.14);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:12px;margin-top:18px;text-align:left}
.now.enter{animation:rise .42s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}}
.nh{display:flex;align-items:center;gap:12px}
.nic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(246,224,182,.16);color:#F6E0B6;flex:none}
.nt{flex:1;min-width:0}
.nt b{display:block;font-size:17px;font-weight:600}
.nt span{display:block;font-size:13px;opacity:.78;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{width:10px;height:10px;border-radius:50%;background:#F6E0B6;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(246,224,182,.55)}80%,100%{box-shadow:0 0 0 10px rgba(246,224,182,0)}}
.nclock{font-size:52px;line-height:1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.nclock.brk{color:#F6E0B6}
.now.rest .nbar i{background:linear-gradient(90deg,#A6BCC9,#FFF4EB)}
.nfoc{display:flex;gap:6px;flex-wrap:wrap}
.nfoc button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,244,235,.28);background:transparent;color:#FFF4EB;font-size:13px;font-weight:500}
.nfoc button.on{background:#FFF4EB;color:#1D2333;border-color:#FFF4EB}
.nbar{height:6px;border-radius:3px;background:rgba(255,244,235,.16);overflow:hidden}
.nbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#C9A66B,#F6E0B6)}
.nfl{font-size:13px;opacity:.82;margin-top:-6px;font-variant-numeric:tabular-nums}
.nbtn{display:flex;gap:8px;flex-wrap:wrap}
.nbtn .btn{flex:1;min-width:130px;border:0}
.btn.w{background:#FFF4EB;color:#1D2333}
.btn.wg{background:rgba(255,244,235,.12);color:#FFF4EB;border:1px solid rgba(255,244,235,.3)}
.thint{display:flex;align-items:center;gap:6px;margin:-2px 0 12px;font-size:13.5px;color:var(--ink-2)}
.thint span{flex:1}
.thint .kbtip{display:none}
.x{width:40px;height:40px;border:0;background:none;color:var(--ink-3);display:grid;place-items:center;padding:0;flex:none;border-radius:12px}

/* activity tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;min-height:66px;padding:10px 10px 10px 9px;border-radius:18px;border:0;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;gap:9px;text-align:left;-webkit-touch-callout:none;transition:transform .12s ease;min-width:0}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tile:active{transform:scale(.97)}
.tic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff}
.tname{font-size:14px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;hyphens:auto;-webkit-hyphens:auto}
.ttime{font-size:12.5px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.tile.run{background:linear-gradient(145deg,var(--c) 0%,var(--c2) 130%);color:#FFF4EB;box-shadow:var(--sh-2)}
.tile.run .tic{background:rgba(246,224,182,.2);color:#F6E0B6}
.kb{display:none;flex:none;align-self:flex-start;min-width:20px;height:20px;padding:0 5px;border-radius:6px;border:1px solid var(--line);font:600 11px/18px var(--f);color:var(--ink-3);text-align:center}
.tile.run .kb{color:rgba(255,244,235,.7);border-color:rgba(255,244,235,.25)}
@media (hover:hover) and (pointer:fine){.kb{display:inline-block}.thint .kbtip{display:inline}}
.tile.run .ttime{color:#F6E0B6;font-weight:600}
.tile.add{background:transparent;box-shadow:none;border:1.5px dashed var(--line);color:var(--ink-3)}
.tile.add .tic{background:var(--card-2);color:var(--ink-2)}

/* tasks */
.trow{display:flex;align-items:center;gap:4px;min-height:62px;border-bottom:1px solid var(--line);cursor:pointer}
.trow:last-child,.addrow-inline:last-child{border-bottom:0}
.chk{width:46px;height:46px;flex:none;border:0;background:none;display:grid;place-items:center;padding:0}
.chk i{width:24px;height:24px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:#fff}
.trow.done .chk i{background:var(--c)}
.trow.done .ttl{text-decoration:line-through;color:var(--ink-3)}
.tb{flex:1;min-width:0;padding:9px 0}
.ttl{font-weight:500;overflow-wrap:anywhere}
.tm{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.mi{display:inline-flex;align-items:center;gap:4px}
.mi.late{color:var(--danger);font-weight:600}
.mi.fact{color:var(--accent);font-weight:600}
.mi.p3{color:var(--danger)} .mi.p2{color:#7b445a}
.play{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:none;color:var(--c);display:grid;place-items:center;padding:0}
.tbtn{flex:none;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:none;font-size:13px;font-weight:600;color:var(--ink-2)}
.addrow-inline{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--accent);font-weight:600;padding:0 0 0 12px;text-align:left}
.more-done{border:0;background:none;color:var(--ink-3);font-weight:600;font-size:13px;min-height:40px;padding:0;display:inline-flex;align-items:center;gap:4px;margin-top:14px}

/* timeline */
.tlh{display:grid;grid-template-columns:44px 6fr 4fr;gap:6px;font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.tl{position:relative}
.tl .hr{position:absolute;left:44px;right:0;border-top:1px solid var(--line)}
.tl .hl{position:absolute;left:0;width:40px;font-size:11px;color:var(--ink-3);transform:translateY(-7px);font-variant-numeric:tabular-nums}
.tl .plan{position:absolute;top:0;bottom:0;left:44px;width:calc((100% - 44px)*.6 - 3px);cursor:copy}
.tl .fact{position:absolute;top:0;bottom:0;left:calc(44px + (100% - 44px)*.6 + 3px);right:0;border-left:1px dashed var(--line)}
.blk{position:absolute;border-radius:10px;background:var(--bgc);border-left:3px solid var(--c);padding:3px 7px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;color:var(--ink)}
.blk b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk small{color:var(--ink-2);font-size:11px}
.blk.done{opacity:.55} .blk.done b{text-decoration:line-through}
.fblk{position:absolute;left:4px;right:0;border-radius:8px;background:var(--c);color:#fff;font-size:11px;line-height:1.2;padding:2px 6px;overflow:hidden;cursor:pointer}
.fblk b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowl{position:absolute;left:40px;right:0;height:2px;background:var(--danger);pointer-events:none;z-index:2}
.nowl::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.tip{font-size:12.5px;color:var(--ink-3);margin:8px 0 0}

/* planner */
.wkn{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wkn .t{flex:1;text-align:center;font-weight:600;font-size:15px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:6px;border-radius:20px;background:var(--card);box-shadow:var(--sh)}
.wd{min-height:64px;border-radius:14px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 0}
.wd small{font-size:11px;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
.wd b{font-size:18px;font-weight:600}
.wd i{display:block;width:5px;height:5px;border-radius:50%;background:transparent}
.wd i.has{background:var(--accent)}
.wd.today b{color:var(--accent)}
.wd.sel{background:var(--on-bg)}
.wd.sel small,.wd.sel b{color:var(--on-fg)}
.wd.sel i.has{background:var(--on-fg)}

/* orrery model: flat vector, lives in the header */
.orb{margin-top:6px}
.orb svg{display:block;width:100%;max-width:400px;height:auto;margin:0 auto}
.orb .cap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;font-size:14px;padding:4px 0 0}
.orb .cap b{font-weight:700;color:#F6E0B6}
.orb .cap span{color:rgba(255,244,235,.72);font-size:12.5px;line-height:1.45}
.orb .lg{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 0 0;font-size:12px;color:rgba(255,244,235,.7)}
.orb .lg i{display:inline-block;vertical-align:middle;margin-right:6px}
.orb .lg .d{width:9px;height:9px;border-radius:50%;background:#C9A66B}
.orb .lg .a{width:16px;height:6px;border-top:1.6px solid #F6E0B6;border-radius:50% 50% 0 0}
.sunt{font:800 12px var(--f);fill:#1D2333}
.hrl{font:600 9px var(--f);fill:rgba(246,224,182,.55)}
.arow{display:flex;align-items:center;gap:12px;min-height:68px;padding:8px 6px 8px 8px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.arow:last-child{border-bottom:0}
.aic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.ab{flex:1;min-width:0}
.ab b{display:block;font-weight:600}
.ab span{display:block;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--card-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--c) 0%,var(--c3) 100%)}
.ord{display:flex;gap:4px}
.ord button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:var(--ink-2)}
.ord button:disabled{opacity:.35}

/* journal */
.ent{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;padding:8px 8px 8px 8px}
.ent:last-child{border-bottom:0}
.ent .aic{width:34px;height:34px}
.ent .pen{display:flex;opacity:.55}
.nedit{flex:none;width:36px;height:36px;border:0;border-radius:12px;background:rgba(255,244,235,.12);color:#FFF4EB;display:grid;place-items:center;margin-left:8px;cursor:pointer}
.splitbox{background:var(--sel);border-radius:18px;padding:14px}
.splitbox .shs{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.splitbox .shs b{font-size:14px}
.ent .ed{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:14px}

/* stats */
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.st{padding:12px;border-radius:18px;background:var(--card);box-shadow:var(--sh)}
.st small{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.st b{display:block;font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ccard{padding:16px;margin-top:14px}
.ccard h2{margin-bottom:10px}
.ax{font:11px var(--f);fill:var(--ink-3)}
.ax.b{fill:var(--ink);font-weight:700}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:8px 0}
.srow .aic{width:34px;height:34px;grid-row:1/3}
.srow .n{font-weight:500;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .v{font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.srow .bar{grid-column:2/4;margin-top:0}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink-2);padding:6px 0}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums}

/* dock & nav */
.dock{position:absolute;left:50%;transform:translateX(-50%);width:calc(100% - var(--gl) - var(--gr));max-width:528px;bottom:12px;display:flex;align-items:center;gap:10px;pointer-events:none;z-index:5}
.dock>*{pointer-events:auto}
.pill{flex:1;min-width:0;min-height:56px;border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 6px 0 8px;color:#FFF4EB;border:0;text-align:left;box-shadow:var(--sh-2);
  background:var(--pill)}
.pill .nic{width:40px;height:40px}
.pill .pt{flex:1;min-width:0;line-height:1.2}
.pill .pt b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .pt span{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.pill .stp{width:44px;height:44px;border-radius:14px;border:0;background:#FFF4EB;color:#1D2333;display:grid;place-items:center;flex:none;padding:0}
.fab{margin-left:auto;width:58px;height:58px;border-radius:20px;border:0;background:var(--g-main);color:#FFF4EB;display:grid;place-items:center;box-shadow:var(--sh-2);flex:none;padding:0}
.nav{flex:none;width:calc(100% - var(--gl) - var(--gr));max-width:528px;margin:4px auto 10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:6px;border-radius:24px;background:var(--card);box-shadow:var(--sh-2)}
.nav button{min-height:52px;border:0;border-radius:18px;background:transparent;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;padding:0;min-width:0}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--accent);background:var(--sel)}
.nav button svg.star{height:22px;width:auto}
.toast{position:absolute;left:0;right:0;top:6px;display:flex;justify-content:center;z-index:30;pointer-events:none}
.toast>div{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 10px 16px;border-radius:16px;background:var(--on-bg);color:var(--on-fg);box-shadow:var(--sh-2);font-size:14px;font-weight:500;max-width:100%}
.toast button{border:0;background:none;color:inherit;font-weight:700;min-height:36px;padding:0 10px;text-decoration:underline;text-underline-offset:3px}

/* sheets */
.host{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.panel{position:absolute;left:0;right:0;bottom:var(--kb,0px);margin:0 auto;max-width:560px;max-height:calc(var(--vvh,100%) - 24px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  background:var(--paper);border-radius:26px 26px 0 0;box-shadow:var(--sh-2);
  padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  animation:up .2s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.shd{display:flex;gap:10px;align-items:center}
.shd h2{flex:1;font-size:19px}
.tinput{flex:1;min-width:0;min-height:52px;font-size:18px;font-weight:600;border:0;border-bottom:2px solid var(--line);background:transparent;border-radius:0;padding:0 2px}
.tinput:focus{outline:0;border-bottom-color:var(--accent)}
.hits{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;min-height:4px}
.hit{padding:3px 10px;border-radius:999px;background:var(--sel);font-size:12.5px;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.row{margin-top:16px}
.row>.lb,.row>label.lb{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:8px}
.foot{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.foot .btn{flex:1;min-width:100px}
.foot .btn.grow{flex:2}
.morebtn{margin-top:16px;border:0;background:none;color:var(--accent);font-weight:600;min-height:40px;padding:0;display:inline-flex;align-items:center;gap:6px}
.achip{min-height:44px;padding:0 14px 0 4px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap}
.achip .ci{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff}
.achip.on{background:var(--c);color:#fff;border-color:transparent}
.achip.on .ci{background:rgba(255,255,255,.2)}
.achip.none .ci{background:var(--card-2);color:var(--ink-3)}
.achip.none.on{background:var(--on-bg);color:var(--on-fg)}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icongrid button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:var(--ink-2)}
.icongrid button.on{background:var(--c);color:#fff;border-color:transparent}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:40px;height:40px;border-radius:50%;border:3px solid var(--paper);background:var(--c);box-shadow:0 0 0 1px var(--line);padding:0}
.swatches button.on{box-shadow:0 0 0 2px var(--ink)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;padding:0}
.stepper b{min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
.ahead{display:flex;align-items:center;gap:12px}
.ahead .aic{width:52px;height:52px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.mini div{padding:10px 12px;border-radius:14px;background:var(--card)}
.mini small{display:block;font-size:12px;color:var(--ink-3)}
.mini b{font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}

/* first-run picker */
.ob{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top, 0px)}
.obs{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:20px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px))}
.obin{max-width:560px;margin:0 auto}
.obtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;color:var(--logo)}
.brand .wm{font:400 26px/1 var(--mark);letter-spacing:.16em;color:var(--ink)}
.brand .tg{display:block;font:500 11px/1.3 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.bline{display:flex;align-items:center;gap:8px;color:#F6E0B6;font:500 10px var(--f);letter-spacing:.07em;text-transform:uppercase;min-width:0}
.bline .wm{font:400 14px/1 var(--mark);letter-spacing:.16em;color:#FFF4EB}
.bline span{color:rgba(255,244,235,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:389px){.bline span{display:none}}
.ob h1{font-size:30px;margin:22px 0 8px}
.oblang{margin-top:18px}
.oblang .chip{min-height:34px;font-size:13px;padding:0 12px}
.ob .lead{margin:0;color:var(--ink-2);font-size:15px;max-width:34em}
.pg{margin-top:22px}
.pg h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.pchip{min-height:44px;padding:0 14px 0 5px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;color:var(--ink)}
.pchip .pi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sel);color:var(--c)}
.pchip.on{background:var(--c);color:#fff;border-color:transparent;padding-right:10px}
.pchip.on .pi{background:rgba(255,255,255,.2);color:#fff}
.obfoot{flex:none;background:var(--paper);border-top:1px solid var(--line);padding:12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.obfoot .obin{display:flex;flex-direction:column;gap:6px}
.obfoot p{margin:0;text-align:center;font-size:12.5px;color:var(--ink-3)}
.qs{display:none}
@media (hover:hover) and (pointer:fine){.qs{display:block}}
.pickfoot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom, 0px));background:var(--paper);padding:12px 0 calc(16px + env(safe-area-inset-bottom, 0px));margin-bottom:calc(-16px - env(safe-area-inset-bottom, 0px));border-top:1px solid var(--line);margin-top:20px}

@media (max-width:370px){
  h1,.ob h1{font-size:26px}
  .nclock{font-size:44px}
  .tiles{gap:8px}
  .tile{padding:8px 10px 8px 8px}
  .tname{font-size:13px}
  .nav button{font-size:10px}
}
@media (prefers-reduced-motion: reduce){
  .panel{animation:none}
  .live{animation:none}
  .tile{transition:none}
}

/* ===== display font ===== */
h1,.dt h1,.nclock,.st b,.ob h1{font-family:var(--fd);font-weight:500;letter-spacing:-.01em}
h1{font-size:28px}
.dt h1{font-size:36px;letter-spacing:-.02em}
.nclock{font-size:46px;font-weight:400;letter-spacing:0}
.st b{font-size:20px}
/* ===== liquid glass controls ===== */
.btn,.chip,.ibtn,.tbtn,.stepper button,.ord button,.achip,.pchip,.icongrid button,.seg,.nav,.tile,.x.glass{
  background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--glass-sh);
  -webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7)}
.btn{border-radius:16px}
.btn:active,.chip:active,.ibtn:active,.tile:active,.achip:active,.pchip:active{transform:scale(.97)}
.btn,.chip,.ibtn,.achip,.pchip,.tile{transition:transform .12s ease,box-shadow .2s ease}
.btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 55%),var(--g-main);border-color:rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 6px rgba(0,0,0,.12),0 12px 24px -14px rgba(35,42,92,.7)}
.btn.primary:disabled{background:var(--glass);color:var(--ink-3);box-shadow:var(--glass-sh)}
.seg{padding:4px;border-radius:18px}
.seg button.on{background:var(--glass-on);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 12px -6px rgba(35,42,92,.35)}
.chip.on,.achip.on,.pchip.on,.icongrid button.on{border-color:rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 18px -12px rgba(0,0,0,.5);-webkit-backdrop-filter:none;backdrop-filter:none}
.chip.on{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 60%),var(--on-bg)}
.achip.on,.pchip.on,.icongrid button.on{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),var(--c)}
.achip.none.on{background:var(--on-bg)}
.nav{border-radius:28px}
.nav button[aria-current="page"]{background:var(--glass-on);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 12px -6px rgba(35,42,92,.3)}
.tile.run{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 50%),linear-gradient(145deg,var(--c) 0%,var(--c2) 130%);border-color:rgba(255,255,255,.25);-webkit-backdrop-filter:none;backdrop-filter:none}
.tile.add{background:transparent;border:1.5px dashed var(--line);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.ibtn.dk,.now .btn.wg,.btn.wg,.nfoc button,.nedit{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px -10px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#FFF8F0}
.nfoc button.on{background:linear-gradient(180deg,#fff,rgba(255,255,255,.86));color:#1E2447;border-color:#fff}
.btn.w{background:linear-gradient(180deg,#fff,rgba(255,255,255,.88));color:#1E2447;border:1px solid #fff;box-shadow:inset 0 -2px 6px rgba(30,36,71,.08),0 10px 22px -14px rgba(0,0,0,.6)}
.now{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 18px 40px -26px rgba(0,0,0,.6)}
.pill{border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),var(--sh-2)}
.fab{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--g-main);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 14px 28px -14px rgba(35,42,92,.7)}
.pill .stp{background:linear-gradient(180deg,#fff,rgba(255,255,255,.86));box-shadow:inset 0 -2px 5px rgba(30,36,71,.1)}
.field{background:var(--glass);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 2px rgba(35,42,92,.06)}
html[data-theme="night"] .field{box-shadow:none}
html[data-theme="night"] .seg button.on,html[data-theme="night"] .nav button[aria-current="page"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
html[data-theme="night"] .btn.w,html[data-theme="night"] .nfoc button.on{color:#151827}
.swatches button{box-shadow:0 0 0 1px var(--line),inset 0 1px 0 rgba(255,255,255,.35)}
.thchip .sw{width:22px;height:22px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);flex:none;margin-left:-6px}
@media (prefers-reduced-transparency: reduce){.btn,.chip,.ibtn,.seg,.nav,.tile,.achip,.pchip{-webkit-backdrop-filter:none;backdrop-filter:none}}
/* ===== dyslexia-friendly mode ===== */
html.dys{--f:'Andika','Manrope',system-ui,sans-serif;--fd:'Andika','Manrope',system-ui,sans-serif}
html.dys body{letter-spacing:.035em;word-spacing:.12em;line-height:1.55}
html.dys h1,html.dys .dt h1,html.dys .nclock,html.dys .st b{font-weight:700;letter-spacing:.01em}
html.dys .lbl,html.dys .row>.lb,html.dys .row>label.lb,html.dys .dsub,html.dys .tlh,html.dys .pg h3,html.dys .lb{text-transform:none;letter-spacing:.02em}
html.dys .tname{-webkit-line-clamp:3}

/* no outlines on buttons */
.btn,.chip,.ibtn,.tbtn,.stepper button,.ord button,.achip,.pchip,.icongrid button,.seg,.nav,.tile,.field,.btn.primary,.fab,.pill,.now,.ibtn.dk,.now .btn.wg,.btn.wg,.nfoc button,.nedit,.btn.w,.nfoc button.on,.chip.on,.achip.on,.pchip.on,.icongrid button.on,.tile.run{border-color:transparent!important}
/* language select */
.selw{position:relative;display:flex;align-items:center}
.selw>svg:first-child{position:absolute;left:14px;color:var(--ink-3);pointer-events:none}
.selw>svg:last-child{position:absolute;right:14px;transform:rotate(90deg);color:var(--ink-3);pointer-events:none}
.selw select{-webkit-appearance:none;appearance:none;padding:0 40px 0 44px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:var(--glass-sh)}
.oblang{margin-top:18px;max-width:260px}
.custrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.colpick{position:relative;overflow:hidden}
.colpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
/* about */
.about{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.about .brand{margin-bottom:4px}
.about p{margin:0;font-size:15px;line-height:1.5;color:var(--ink-2)}
.about p.muted{font-size:13.5px;color:var(--ink-3)}
.alink{justify-content:flex-start;gap:14px;min-height:60px;text-decoration:none;color:var(--ink);padding:0 18px}
.alink svg{color:var(--accent)}
.alink span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.alink small{font-size:12px;font-weight:500;color:var(--ink-3)}

/* tablets and wide screens: wider column, larger type, three tiles per row */
@media (min-width:700px){
  .scroll>:not(.hdr),.hin,.nav,.dock{max-width:720px}
  body{font-size:16px}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .tile{min-height:74px}
  .tname{font-size:15px}
  .orb svg{max-width:460px}
  .panel{max-width:680px;border-radius:28px 28px 0 0}
  .nav button{min-height:58px;font-size:12px}
  .dt h1{font-size:44px}
}
@media (min-width:700px) and (max-height:900px) and (orientation:landscape){
  .orb svg{max-width:380px}
  .ripple{max-width:300px}
}

.rng{display:block;margin-top:14px}
.rng span{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}

/* --- pomodoro --- */
const pomoLen=P=>P.phase==='work'?P.work:((P.cycle%P.every===0)?P.long:P.brk);
const phaseEnd=P=>P.phaseStart+pomoLen(P)*60000;
function newPomo(start){const c=S.pomoCfg;return {work:c.work,brk:c.brk,long:c.long,every:c.every,phase:'work',phaseStart:start,cycle:1};}
function pushEntry(T,end){if(end-T.start>=30000)S.entries.push({id:'e'+uid8(),actId:T.actId,taskId:T.taskId,note:'',start:T.start,end:end});}
function enablePomo(){
  const T=S.timer;if(!T||T.pomo)return;const now=Date.now();
  T.pomo=newPomo(T.start);T.focus=0;
  if(now-T.start>=T.pomo.work*60000){pushEntry(T,now);T.pomo.phase='break';T.pomo.phaseStart=now;}
}
/* переходит между фазами по времени; возвращает 'switch' | 'done' | '' */
function advancePomo(now){
  const T=S.timer;if(!T||!T.pomo)return '';
  let res='',guard=0;
  while(S.timer&&S.timer.pomo&&now>=phaseEnd(S.timer.pomo)&&guard++<50){
    const P=S.timer.pomo,end=phaseEnd(P);
    if(P.phase==='work'){pushEntry(S.timer,end);P.phase='break';P.phaseStart=end;res='switch';}
    else if(P.cycle%P.every===0){S.timer=null;res='done';}
    else{P.phase='work';P.phaseStart=end;P.cycle++;S.timer.start=end;res='switch';}
  }
  return res;
}
function skipPhase(){
  const T=S.timer;if(!T||!T.pomo)return;const now=Date.now(),P=T.pomo;
  if(P.phase==='work'){pushEntry(T,now);P.phase='break';P.phaseStart=now;}
  else{P.phase='work';P.phaseStart=now;P.cycle++;T.start=now;}
  persist();render();syncTimerNotif();
}
function clockMs(T){return T.pomo?Math.max(0,phaseEnd(T.pomo)-Date.now()):Date.now()-T.start;}

/* --- sound (browser): chime scheduled on the audio clock, so it rings on time even in a background tab --- */
let AC=null,chime=null;
function audioUnlock(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}if(AC.state==='suspended')AC.resume();}catch(e){}}
function playChime(t0){
  const out=[];const master=AC.createGain();master.gain.value=.2;master.connect(AC.destination);
  [659.25,783.99,1046.5,1318.5].forEach((f,i)=>{const t=t0+i*.17;[[1,.5],[2,.1]].forEach(h=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*h[0];g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(h[1],t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+1.7);o.connect(g);g.connect(master);o.start(t);o.stop(t+1.8);out.push(o);});});
  return out;
}
function cancelChime(){if(chime){chime.nodes.forEach(n=>{try{n.stop();}catch(e){}});chime=null;}}
function nextAlarm(){const T=S.timer;if(!T)return 0;if(T.pomo)return phaseEnd(T.pomo);if(T.focus&&!T.focusDone)return T.start+T.focus*60000;return 0;}
function syncChime(){
  if(!S.sound||CAP()||!AC){cancelChime();return;}
  const at=nextAlarm();if(!at){cancelChime();return;}
  if(chime&&chime.at===at)return;
  cancelChime();
  const delay=(at-Date.now())/1000;if(delay<-1)return;
  try{chime={at:at,nodes:playChime(AC.currentTime+Math.max(0,delay))};}catch(e){chime=null;}
}

function finishTimer(end,silent){
  const T=S.timer;if(!T)return;S.timer=null;
  if(T.pomo&&T.pomo.phase==='break'){if(!silent)toast(trn('Помодоро остановлено'));return;}
  end=Math.max(end,T.start);
  const a=actOf(T.actId);
  if(end-T.start>=30000){
    const ne={id:'e'+uid8(),actId:T.actId,taskId:T.taskId,note:'',start:T.start,end:end};S.entries.push(ne);lastEntryId=ne.id;
    if(!silent)toast(actName(a)+trn(': записано ')+fmtDur(Math.max(1,(end-T.start)/60000)),{btn:trn('Исправить'),act:'lastEntry'});
  }else if(!silent)toast(trn('Отрезки короче 30 секунд не учитываются в статистике'));
}
function startTimer(o){

  const start=o.at||Date.now();

  if(S.lastMode==='pomo'&&!o.at)S.timer.pomo=newPomo(start);
  S.hintDone=true;UI.justStarted=true;
  persist();render();syncTimerNotif();
}
function stopTimer(o){
  o=o||{};if(!S.timer)return;

}

/* ============ quick-add parser ============ */
const WDRX=[['воскресень(?:е|я|ю)',0],['понедельник(?:у|а)?',1],['вторник(?:у|а)?',2],['сред(?:а|у|е|ы)',3],['четверг(?:у|а)?',4],['пятниц(?:а|у|е|ы)',5],['суббот(?:а|у|е|ы)',6]];
const END='(?=$|[\\s,;.!?—–-])';
const stem=n=>{n=n.toLowerCase();const L=n.length;return n.slice(0,L-(L>6?2:L>4?1:0));};
function parseQuick(text){
  let t=' '+text.replace(/\s+/g,' ')+' ';
  const r={},hits=[];
  const cut=(re,fn)=>{const m=re.exec(t);if(!m)return false;if(fn(m)===false)return false;t=t.slice(0,m.index)+' '+t.slice(m.index+m[0].length);return true;};
  const setDate=(prep,key)=>{if(prep==='к'||prep==='до'){r.deadline=key;hits.push(trn('Дедлайн: ')+dateLabel(key));}else{r.date=key;hits.push(dateLabel(key));}};
  cut(/(^|\s)(!{1,3})(?=\s|$)/,m=>{r.prio=m[2].length;hits.push(trn('Приоритет ')+m[2]);});
  cut(/(^|\s)#([\p{L}\d_-]+)/u,m=>{const a=liveActs().find(x=>x.name.toLowerCase().indexOf(m[2].toLowerCase())===0);if(!a)return false;r.actId=a.id;});
  cut(/(^|\s)@([\p{L}\d_-]+)/u,m=>{const p=S.projects.find(x=>x.name.toLowerCase().indexOf(m[2].toLowerCase())===0);if(!p)return false;r.projectId=p.id;hits.push(trn('Проект: ')+p.name);if(!r.actId&&p.actId)r.actId=p.actId;});
  cut(/(^|\s)(?:(?:в|к|на)\s+)?(\d{1,2}):(\d{2})(?=$|[\s,;.!?])/,m=>{const h=+m[2],mi=+m[3];if(h>23||mi>59)return false;r.start=pad(h)+':'+pad(mi);hits.push(trn('В ')+r.start);});
  if(!r.start)cut(/(^|\s)в\s+(\d{1,2})\s*час\p{L}*(?=$|[\s,;.!?])/u,m=>{const h=+m[2];if(h>23)return false;r.start=pad(h)+':00';hits.push(trn('В ')+r.start);});
  let dm=null;
  cut(new RegExp('(^|\\s)(?:на\\s+)?(\\d+)\\s*(?:ч|час\\p{L}*)\\s*(\\d+)\\s*(?:м|мин\\p{L}*)?'+END,'u'),m=>{dm=(+m[2])*60+(+m[3]);});
  if(dm==null)cut(new RegExp('(^|\\s)(?:на\\s+)?(\\d+(?:[.,]\\d+)?)\\s*(?:ч|час\\p{L}*)'+END,'u'),m=>{dm=Math.round(parseFloat(m[2].replace(',','.'))*60);});
  if(dm==null)cut(new RegExp('(^|\\s)(?:на\\s+)?(\\d+)\\s*(?:м|мин\\p{L}*)'+END,'u'),m=>{dm=+m[2];});
  if(dm==null)cut(new RegExp('(^|\\s)(?:на\\s+)?полчаса'+END,'u'),()=>{dm=30;});
  if(dm==null)cut(new RegExp('(^|\\s)на\\s+час'+END,'u'),()=>{dm=60;});
  if(dm!=null&&dm>0&&dm<=1440){r.dur=dm;hits.push(fmtDur(dm));}
  if(!r.start)cut(/(^|\s)в\s+(\d{1,2})(?=$|[\s,;.!?])/,m=>{const h=+m[2];if(h>23)return false;r.start=pad(h)+':00';hits.push(trn('В ')+r.start);});
  const now=new Date();
  const rel=cut(new RegExp('(^|\\s)(?:(к|до|на|в)\\s+)?(сегодня|послезавтра|завтра)'+END,'u'),m=>{const n=m[3]==='сегодня'?0:m[3]==='завтра'?1:2;setDate(m[2],dkey(addDays(now,n)));});
  if(!rel)cut(new RegExp('(^|\\s)через\\s+(\\d+)\\s*(?:дн\\p{L}*|д)'+END,'u'),m=>{setDate('',dkey(addDays(now,+m[2])));});
  if(r.date==null&&r.deadline==null){
    for(let i=0;i<WDRX.length;i++){
      const re=new RegExp('(^|\\s)(?:(к|до|на|в|во)\\s+)?'+WDRX[i][0]+END,'u');
      if(cut(re,m=>{let d=(WDRX[i][1]-now.getDay()+7)%7;if(d===0)d=7;setDate(m[2],dkey(addDays(now,d)));}))break;
    }
  }
  if(r.date==null&&r.deadline==null)cut(new RegExp('(^|\\s)(?:(к|до|на|в)\\s+)?(\\d{1,2})\\.(\\d{1,2})(?:\\.(\\d{2,4}))?'+END),m=>{
    const dd=+m[3],mm=+m[4];if(dd<1||dd>31||mm<1||mm>12)return false;
    let y=m[5]?+m[5]:now.getFullYear();if(y<100)y+=2000;
    let d=new Date(y,mm-1,dd);if(!m[5]&&dkey(d)<todayKey())d=new Date(y+1,mm-1,dd);
    setDate(m[2],dkey(d));});
  let title=t.replace(/\s+/g,' ').trim().replace(/^[\s—–\-,:;]+|[\s—–\-,:;]+$/g,'').replace(/\s+(в|к|на|до|во)$/,'').trim();
  if(!title)title=text.trim();
  if(!r.actId){
    const low=' '+title.toLowerCase();
    const cand=liveActs().slice().sort((a,b)=>b.name.length-a.name.length);
    for(const a of cand){const s=stem(a.name);if(s.length>=3&&(low.indexOf(' '+s)>=0)){r.actId=a.id;break;}}
  }
  if(r.actId){const a=actOf(r.actId);if(a)hits.unshift(a.name);}
  r.title=title;r.hits=hits;
  return r;
}

/* --- timeline: plan vs fact --- */
const H0=6,H1=24,HH=52;
function tlHtml(day){
  const items=S.tasks.filter(t=>t.date===day&&t.start).map(t=>{const s=toMin(t.start);return {t:t,s:s,e:s+(t.dur||30)};}).sort((a,b)=>a.s-b.s||a.e-b.e);
  let cl=[],cEnd=0;
  const fl=()=>{const n=cl.reduce((m,x)=>Math.max(m,x.col+1),1);cl.forEach(x=>{x.cols=n;});cl=[];};
  items.forEach(it=>{
    if(cl.length&&it.s>=cEnd){fl();cEnd=0;}
    const used=cl.filter(x=>x.e>it.s).map(x=>x.col);let c=0;while(used.indexOf(c)>=0)c++;
    it.col=c;cl.push(it);cEnd=Math.max(cEnd,it.e);
  });
  fl();
  const px=m=>(m-H0*60)*HH/60;
  let h=trn('<div class="tlh"><span></span><span>План</span><span>Факт</span></div><div class="tl" style="height:')+(H1-H0)*HH+'px">';
  for(let hr=H0;hr<=H1;hr++)h+='<div class="hr" style="top:'+(hr-H0)*HH+'px"></div>'+(hr<H1?'<div class="hl" style="top:'+(hr-H0)*HH+'px">'+pad(hr)+':00</div>':'');
  h+='<div class="plan" data-act="slot" data-day="'+day+trn('" aria-label="Нажмите на время, чтобы запланировать">');
  items.forEach(it=>{
    if(it.s>=H1*60)return;
    const s=Math.max(it.s,H0*60),e=Math.min(it.e,H1*60);const a=actOf(it.t.actId);const c=col(actColor(a));
    h+='<div class="blk'+(it.t.done?' done':'')+'" data-act="openTask" data-id="'+it.t.id+'" style="top:'+px(s)+'px;height:'+Math.max(24,(e-s)*HH/60-2)+'px;left:'+(it.col/it.cols*100)+'%;width:calc('+(100/it.cols)+'% - 3px);--c:'+c+';--bgc:'+tint(actColor(a))+'"><b>'+esc(it.t.title)+'</b><small>'+it.t.start+'–'+fromMin(it.e)+'</small></div>';
  });
  h+='</div><div class="fact">';
  const r=dayRange(day);
  allEntries().forEach(e=>{
    const s=Math.max(e.start,r[0]),en=Math.min(e.end,r[1]);if(en<=s)return;
    const sm=(s-r[0])/60000,em=(en-r[0])/60000;if(em<=H0*60||sm>=H1*60)return;
    const ss=Math.max(sm,H0*60),ee=Math.min(em,H1*60);const a=actOf(e.actId);const hh=(ee-ss)*HH/60;
    h+='<div class="fblk" '+(e.running?'':'data-act="openEntry" data-id="'+e.id+'"')+' style="top:'+px(ss)+'px;height:'+Math.max(4,hh-1)+'px;--c:'+col(actColor(a))+'">'+(hh>=26?'<b>'+esc(actName(a))+'</b>'+fmtDur((e.end-e.start)/60000):'')+'</div>';
  });
  h+='</div>';
  if(day===todayKey()){const n=new Date();const nm=n.getHours()*60+n.getMinutes();if(nm>=H0*60&&nm<H1*60)h+='<div class="nowl" style="top:'+px(nm)+'px"></div>';}
  return h+'</div>';
}

/* --- Orrery (Занятия): concentric composition --- */
const ORB_T0=(window.performance?performance.now():0);
const RINGS=[52,78,104];
let ORB=null,orbRaf=0;
const polar=(r,deg)=>{const a=(deg-90)*Math.PI/180;return [170+r*Math.cos(a),170+r*Math.sin(a)];};
function arcPath(r,d0,d1){
  if(d1-d0>=359.5)return 'M'+(170)+' '+(170-r)+' A'+r+' '+r+' 0 1 1 '+(169.99)+' '+(170-r);
  const p0=polar(r,d0),p1=polar(r,d1);
  return 'M'+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+' A'+r+' '+r+' 0 '+(d1-d0>180?1:0)+' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2);
}
function orbitSvg(){
  const acts=liveActs();const mon=mondayOf(new Date());const ws=mon.getTime();
  const by=byActIn(ws,Date.now()+1);
  const total=Object.keys(by).reduce((s,k)=>s+by[k],0);
  const max=Math.max(1,...acts.map(a=>by[a.id]||0));
  const tk=todayKey();
  let s=trn('<svg viewBox="0 0 340 340" role="img" aria-label="Модель вашей недели: в центре — время за неделю, на орбитах — занятия, внешние кольца — дни недели по часам">');
  /* outer band: 7 day rings, 24h clock, arcs = tracked time */
  const R0=116,ST=5.2;
  const ents=allEntries();
  for(let i=0;i<7;i++){
    const d=addDays(mon,i);const k=dkey(d);const r=R0+i*ST;const isT=k===tk;const fut=k>tk;
    s+='<circle cx="170" cy="170" r="'+r.toFixed(1)+'" fill="none" stroke="#EFDBB2" stroke-opacity="'+(fut?.1:isT?.34:.2)+'" stroke-width=".8"/>';
    const a=d.getTime(),b=addDays(d,1).getTime();
    ents.forEach(e=>{
      const s0=Math.max(e.start,a),s1=Math.min(e.end,b);if(s1-s0<60000)return;
      const d0=(s0-a)/864e5*360,d1=Math.max(d0+2.2,(s1-a)/864e5*360);
      s+='<path d="'+arcPath(r,d0,d1)+'" fill="none" stroke="'+(isT?'#FFF7E6':'#EFDBB2')+'" stroke-width="1.7" stroke-linecap="round"/>';
    });
  }
  const RT=R0+6*ST;
  [0,6,12,18].forEach(h=>{const deg=h*15;const p0=polar(RT+4,deg),p1=polar(RT+8,deg),pl=polar(RT+16,deg);
    s+='<line x1="'+p0[0].toFixed(1)+'" y1="'+p0[1].toFixed(1)+'" x2="'+p1[0].toFixed(1)+'" y2="'+p1[1].toFixed(1)+'" stroke="#EFDBB2" stroke-opacity=".6" stroke-width="1"/><text class="hrl" x="'+pl[0].toFixed(1)+'" y="'+(pl[1]+3).toFixed(1)+'" text-anchor="middle">'+pad(h)+'</text>';});
  /* planet orbits */
  RINGS.forEach(r=>{s+='<circle cx="170" cy="170" r="'+r+'" fill="none" stroke="#EFDBB2" stroke-opacity=".7" stroke-width="1"/>';});
  /* sun */
  s+='<circle cx="170" cy="170" r="21" fill="#FFF7E6"/><text class="sunt" x="170" y="174" text-anchor="middle">'+esc(fmtH(total))+'</text>';

    s+='<g data-ring="'+k+'">';

      const deg=k*47+j*360/Math.max(1,list.length);
      const m=by[a.id]||0;const pr=3.6+7.4*Math.sqrt(m/max);
      const p=polar(r,deg);const sel=a.id===UI.orbSel;
      const open=Math.min(2,S.tasks.filter(t=>!t.done&&t.actId===a.id).length);
      for(let q=0;q<open;q++){const mp=polar(r,deg-(pr/r*57.3)-7-q*7);s+='<circle cx="'+mp[0].toFixed(1)+'" cy="'+mp[1].toFixed(1)+'" r="1.9" fill="#EFDBB2"/>';}
      s+='<g data-act="orbSel" data-id="'+a.id+'" style="cursor:pointer" role="button" aria-label="'+esc(a.name)+'">'
        +'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="15" fill="transparent"/>'
        +(sel?'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(pr+5).toFixed(1)+'" fill="none" stroke="#FFF4EB" stroke-width="1.3"/>':'')
        +'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+pr.toFixed(1)+'" fill="'+(sel?'#FFF4EB':'#EFDBB2')+'"/></g>';
    });
    s+='</g>';
    ORB.rings.push({k:k,T:110*Math.pow(r/52,1.5)});
  });
  return s+'</svg>';
}
function placePlanets(now){

  $$('[data-clock]').forEach(n=>{n.textContent=fmtHMS(cm);});
  try{document.title=(T.pomo&&T.pomo.phase==='break'?trn('Перерыв '):'')+fmtHMS(cm)+' · '+actName(actOf(T.actId));}catch(e){}

function atTime(base,t){const q=t.split(':');return new Date(base.getFullYear(),base.getMonth(),base.getDate(),+q[0],+q[1]).getTime();}
function saveEntry(){
  readSheetFields();const d=SH.d;
  if(!d.date||!d.start||!d.end){toast(trn('Укажите дату, начало и конец'));return;}
  const b=pk(d.date);
  const s=atTime(b,d.start);let en=atTime(b,d.end);
  if(en<=s)en+=864e5;
  if(en-s>16*3600000){toast(trn('Получилось больше 16 часов. Проверьте время'));return;}
  if(en>Date.now()+60000){toast(trn('Конец записи не может быть в будущем'));return;}
  let sp=0;
  if(SH.id&&d.split){
    if(!d.splitAt){toast(trn('Укажите, когда началось другое занятие'));return;}
    sp=atTime(b,d.splitAt);if(sp<=s)sp+=864e5;
    if(sp<=s||sp>=en){toast(trn('Время разделения должно быть между ')+d.start+trn(' и ')+d.end);return;}
  }
  if(SH.id){const e=S.entries.find(x=>x.id===SH.id);if(e){e.actId=d.actId;e.note=d.note.trim();e.start=s;e.end=sp||en;}
    if(sp)S.entries.push({id:'e'+uid8(),actId:d.splitAct,taskId:'',note:'',start:sp,end:en});}
  else S.entries.push({id:'e'+uid8(),actId:d.actId,taskId:'',note:d.note.trim(),start:s,end:en});
  persist();closeSheet();render();toast(sp?trn('Запись разделена'):trn('Время сохранено'));
}

function backTime(t,ref){let x=atTime(new Date(ref),t);if(x>ref+60000)x-=864e5;return x;}
function saveRun(){
  readSheetFields();const T=S.timer;const d=SH.d;if(!T){closeSheet();return;}
  const now=Date.now();
  const st=d.start?backTime(d.start,now):T.start;
  if(now-st>16*3600000){toast(trn('Получилось больше 16 часов. Проверьте время'));return;}
  if(d.split){
    if(!d.splitAt){toast(trn('Укажите, когда началось другое занятие'));return;}
    const sp=backTime(d.splitAt,now);
    if(sp<=st){toast(trn('Другое занятие должно начаться после ')+d.start);return;}
    if(sp-st>=30000)S.entries.push({id:'e'+uid8(),actId:d.actId,taskId:T.taskId,note:'',start:st,end:sp});
    T.actId=d.splitAct;T.taskId='';T.start=sp;T.focus=0;T.focusDone=false;if(T.pomo)T.pomo=newPomo(sp);
  }else{
    if(d.actId!==T.actId)T.taskId='';
    T.actId=d.actId;T.start=st;if(T.pomo&&T.pomo.phase==='work'&&T.pomo.cycle===1)T.pomo.phaseStart=st;
  }
  persist();closeSheet();render();syncTimerNotif();toast(d.split?trn('Прошлое занятие записано, отсчёт идёт дальше'):trn('Таймер исправлен'));

/* ============ events ============ */
let lpT=null,lpXY=null;
['pointerdown','keydown'].forEach(n=>document.addEventListener(n,()=>{if(!AC&&S&&S.sound&&!CAP()){audioUnlock();syncChime();}},{capture:true}));
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('[data-lp]');if(!t)return;
  lpXY=[e.clientX,e.clientY];clearTimeout(lpT);
  lpT=setTimeout(()=>{UI.lp=true;openActSheet(t.getAttribute('data-lp'));},550);
});
document.addEventListener('pointermove',e=>{if(lpT&&lpXY&&Math.hypot(e.clientX-lpXY[0],e.clientY-lpXY[1])>10){clearTimeout(lpT);lpT=null;}});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>{clearTimeout(lpT);lpT=null;}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-lp]'))e.preventDefault();});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(UI.lp){UI.lp=false;if(el.closest('[data-lp]'))return;}
  if(el.disabled)return;
  const f=ACT[el.dataset.act];if(f)f(el.dataset,el,e);
});
document.addEventListener('input',e=>{
  const t=e.target;if(!SH)return;
  if(t.id==='shTitle'&&SH.kind==='task')onTitleInput();
  else if(t.id==='shNotes'&&SH.kind==='task')SH.draft.manual.notes=t.value;
  else if(t.id==='enNote'&&SH.kind==='entry')SH.d.note=t.value;
  else if(t.id==='pjName'&&SH.kind==='proj')SH.d.name=t.value;
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='thColor'){S.customColor=t.value;applyTheme();render();}
  else if(t.id==='thAccent'){S.cAccent=t.value;applyTheme();render();}
  else if(t.id==='thBlur'){S.cBlur=+t.value;applyTheme();const b=t.parentNode.querySelector('b');if(b)b.textContent=t.value;}
  else if(t.id==='thBlk'){S.cBlk=1-(+t.value)/100;applyTheme();const b=t.parentNode.querySelector('b');if(b)b.textContent=t.value+'%';}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='langSel'){ACT.lang({v:t.value});return;}
  if(t.id==='thColor'||t.id==='thAccent'||t.id==='thBlur'||t.id==='thBlk'){persist();if(SH&&SH.kind==='settings')rerenderSheet(settingsHtml);return;}
  if(t.id==='thPhoto'&&t.files&&t.files[0]){loadPhoto(t.files[0]);return;}
  if(!SH)return;
  if(SH.kind==='task'){
    if(t.id==='shDate'){SH.draft.manual.date=t.value||null;updateTaskSheet();}
    else if(t.id==='shTime'){SH.draft.manual.start=t.value||null;updateTaskSheet();}
    else if(t.id==='shDead'){SH.draft.manual.deadline=t.value||null;updateTaskSheet();}
    else if(t.id==='shProj'){SH.draft.manual.projectId=t.value||'';const p=projOf(t.value);if(p&&p.actId&&!val('actId'))SH.draft.manual.actId=p.actId;updateTaskSheet();}
  }else if(SH.kind==='entry'){
    if(t.id==='enDate')SH.d.date=t.value;else if(t.id==='enStart')SH.d.start=t.value;else if(t.id==='enEnd')SH.d.end=t.value;else if(t.id==='spAt')SH.d.splitAt=t.value;
  }else if(SH.kind==='run'){
    if(t.id==='rnStart')SH.d.start=t.value;else if(t.id==='spAt')SH.d.splitAt=t.value;
  }else if(SH.kind==='act'){
    if(t.id==='actName'){const a=actOf(SH.id);const v=t.value.trim();if(v){a.name=v;persist();}else t.value=a.name;}
  }else if(SH.kind==='proj'){
    if(t.id==='pjDead')SH.d.deadline=t.value;
  }else if(SH.kind==='settings'&&t.id==='impFile'&&t.files&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{try{const r=JSON.parse(String(fr.result));if(!r||!Array.isArray(r.acts)||!Array.isArray(r.tasks))throw 0;S=normalize(r);S.onboarded=true;persist();applyTheme();closeSheet();render();toast(trn('Копия загружена'));}catch(err){toast(trn('Этот файл не похож на копию ORRERY'));}};
    fr.readAsText(t.files[0]);
  }
});
const typing=el=>!!el&&(/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)||el.isContentEditable);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&SH){closeSheet();return;}
  if(!SH&&S.onboarded&&!typing(e.target)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    if(/^[1-9]$/.test(e.key)){const a=liveActs()[+e.key-1];if(a){e.preventDefault();tapActivity(a.id);}return;}
    if(e.key===' '||e.code==='Space'){if(S.timer){e.preventDefault();stopTimer();}return;}
    if(e.key==='n'||e.key==='N'||e.key==='\u0442'||e.key==='\u0422'){e.preventDefault();openNewSheet({date:todayKey()});return;}
  }
  if(e.key!=='Enter')return;
  const id=e.target.id;
  if(id==='shTitle'){e.preventDefault();saveTaskSheet();}
  else if(id==='customName'){e.preventDefault();addCustom();}
  else if(id==='actName'){e.preventDefault();e.target.blur();}
  else if(id==='pjName'){e.preventDefault();ACT.pjSave();}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!SH)render();});


function vv(){const v=window.visualViewport;if(!v)return;const r=document.documentElement;r.style.setProperty('--kb',Math.max(0,window.innerHeight-v.height-v.offsetTop)+'px');r.style.setProperty('--vvh',v.height+'px');}
if(window.visualViewport){visualViewport.addEventListener('resize',vv);visualViewport.addEventListener('scroll',vv);vv();}

/* ============ boot ============ */
try{document.documentElement.lang='ru';}catch(e){}
S=normalize(lsGet()||blank());
if(S.timer&&S.timer.pomo&&advancePomo(Date.now())){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
applyTheme();
render();
setInterval(tick,1000);
setInterval(()=>{const a=document.activeElement;if(SH||!S.onboarded||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))return;render();},60000);
let ignoreHash=false;
function clearHash(){ignoreHash=true;try{history.replaceState(null,'',location.pathname+location.search);ignoreHash=false;}catch(e){location.hash='';}}
function handleHash(){
  if(ignoreHash){ignoreHash=false;return;}
  const h=(location.hash||'').replace(/^#/,'');if(!h||!S.onboarded)return;
  const m=/^go-([A-Za-z0-9]+)$/.exec(h);
  if(m&&actOf(m[1])){clearHash();startTimer({actId:m[1]});UI.tab='today';render();toast(trn('Таймер запущен: ')+actName(actOf(m[1])));}
  else if(h==='stop'){clearHash();stopTimer();}
}
window.addEventListener('hashchange',handleHash);
handleHash();
initDb();
(function nativeBoot(){
  const AppP=plug('App');
  if(AppP){
    try{AppP.addListener('backButton',()=>{if(SH){closeSheet();return;}if(!S.onboarded){AppP.exitApp();return;}if(UI.tab!=='today'){UI.tab='today';render();$('#scroll').scrollTop=0;return;}AppP.exitApp();});}catch(e){}
    try{AppP.addListener('resume',()=>{pullNative();if(advancePomo(Date.now())){persist();syncTimerNotif();}if(!SH)render();});}catch(e){}
    try{AppP.addListener('appUrlOpen',ev=>{pullNative().then(()=>handleUrl(ev&&ev.url));});}catch(e){}
    try{AppP.getLaunchUrl().then(r=>{if(r&&r.url)pullNative().then(()=>handleUrl(r.url));});}catch(e){}
  }
  const OT=plug('OrreryTimer');
  if(OT){try{OT.addListener('commands',()=>pullNative());}catch(e){}pullNative();syncWidget();}
  const SB=plug('StatusBar');
  if(SB){try{SB.setStyle({style:'DARK'});SB.setBackgroundColor({color:THEMES[curTheme()].top});}catch(e){}}
  if(S.timer)syncTimerNotif();
  syncReminders();
})();
})();
</script>
